# OSRSheim waystones — the biome-oath travel network (KG Marketplace 10.x, rewritten 2026-09-21)
# Docs: https://kg-marketplace.pages.dev/configs/teleporters/
# Line format:  Destination Name, x, y, z[, icon]      <speed=N> inside the name = slow travel.
# x y z are int.Parse: ROUND the decimals the console 'pos' prints. Name may contain spaces.
# @from: <profile> copies another profile's lines. Inheritance is ONE LEVEL: a copied entry's own
# @from is not expanded, so each tier lists every earlier tier explicitly (flat fan-in, not a chain).
#
# There is NO gating in this file: the parser reads [profile] / lines only, no conditions, no cost,
# no keys, and '=' in a header is not a tag (it becomes part of the profile name). All gating and the
# coin fee live on the dialogue reply that opens the profile — see Dialogues\osrsheim_oaths.cfg.
# The profile the player gets is picked by their diary key, so tier N never shows tier N+1's pin.
#
# To fill this in on Gielheim:
#   1. stand where the waystone NPC will be, open the console (F5), type  pos
#   2. round x y z to whole numbers into the line below and remove the leading '#'
#   3. place the NPC there with the Marketplace Hammer (Type Teleporter, Dialogue waystone)
#   4. save — KG hot-reloads the profile.
# Until the coordinates are filled every profile is empty and the map opens with no pins.

# --- tier 1: Meadows oath ---
[oath_network_1]
# Kaupang the market town, 0, 30, 0
# The Meadows waystone, 0, 30, 0

# --- tier 2: + Black Forest oath ---
[oath_network_2]
@from: oath_network_1
# The Black Forest waystone, 0, 30, 0

# --- tier 3: + Swamp oath ---
[oath_network_3]
@from: oath_network_1
@from: oath_network_2
# The Swamp waystone<speed=25>, 0, 30, 0
