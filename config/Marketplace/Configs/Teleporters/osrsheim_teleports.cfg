# OSRSheim waystones — the biome-oath travel network (KG Marketplace 10.x, 8 tiers 2026-09-21)
# Docs: https://kg-marketplace.pages.dev/configs/teleporters/
# Line format:  Destination Name, x, y, z[, icon]      <speed=N> inside the name = slow travel.
# x y z are int.Parse: ROUND the decimals the console 'pos' prints. Name may contain spaces.
# @from: <profile> copies another profile's lines. Inheritance is ONE LEVEL: a copied entry's own
# @from is not expanded, so each tier lists every earlier tier explicitly (flat fan-in, not a chain).
#
# There is NO gating in this file: the parser reads [profile] / lines only, no conditions, no cost,
# no keys, and '=' in a header is not a tag (it becomes part of the profile name). All gating and the
# coin fee live on the dialogue reply that opens the profile — see Dialogues\osrsheim_oaths.cfg.
# The profile the player gets is picked by their highest diary key, so tier N never shows tier N+1.
#
# DO NOT hand-edit the coordinates. Stand on the spot in game, press F5, type  pos , then run:
#     python scripts\set-waystone.py <node> "<the pos line>"
# e.g. python scripts\set-waystone.py mountain "pos:(1043.2, 187.61, -2290.9)"
# It rounds, fills every tier that carries the node and uncomments the line. Then sync-configs -Push.
#
# PLACEMENT RULES (decided 2026-09-21; the spot is Doug's call inside the rule)
#   Every stone: flat buildable ground, no spawner within ~30 m, above the water line, and at least
#   ~500 m from Kaupang so it is never a shortcut to somewhere you can already walk. Put it where you
#   will keep coming back — the stone is the reason that place stays useful after the biome is done.
#   kaupang     the market town itself. The hub; every tier carries it. Place it beside the NPCs.
#   meadows     the first MWL village or tavern outside the spawn ring, or the Eikthyr altar clearing.
#   blackforest the Elder altar, or the burial-chamber cluster you farm for surtling cores.
#   swamp       the shore edge of your main crypt swamp where you beach the boat — NOT inland.
#   mountain    the silver field below the frost-cave line, or the Moder altar saddle.
#   plains      the first fuling village you clear, near the barley and flax.
#   mistlands   a dvergr outpost, or the ridge above the Queen's entrance.
#   ashlands    the landing beach or the fortress approach — the safest strip you can hold.
#   deepnorth   the camp you stage from for Fader.
# Until a line is filled its profile simply has one pin fewer; an empty profile opens an empty map.

# --- tier 1: Meadows oath (fee 25c) ---
[oath_network_1]
# Kaupang, 0, 30, 0
# Meadows stone, 0, 30, 0

# --- tier 2: + Black Forest oath (fee 50c) ---
[oath_network_2]
@from: oath_network_1
# Black Forest stone, 0, 30, 0

# --- tier 3: + Swamp oath (fee 100c) ---
[oath_network_3]
@from: oath_network_1
@from: oath_network_2
# Swamp stone, 0, 30, 0

# --- tier 4: + Mountain oath (fee 150c) ---
[oath_network_4]
@from: oath_network_1
@from: oath_network_2
@from: oath_network_3
# Mountain stone, 0, 30, 0

# --- tier 5: + Plains oath (fee 200c) ---
[oath_network_5]
@from: oath_network_1
@from: oath_network_2
@from: oath_network_3
@from: oath_network_4
# Plains stone, 0, 30, 0

# --- tier 6: + Mistlands oath (fee 300c) ---
[oath_network_6]
@from: oath_network_1
@from: oath_network_2
@from: oath_network_3
@from: oath_network_4
@from: oath_network_5
# Mistlands stone, 0, 30, 0

