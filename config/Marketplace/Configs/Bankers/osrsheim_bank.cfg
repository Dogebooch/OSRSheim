# OSRSheim bank — KG Marketplace 10.x (authored 2026-09-19, UNTESTED)
# Docs: https://kg-marketplace.pages.dev/configs/bankers/
# One prefab per line = the item types this bank accepts. Banked items live in the server DB
# (Marketplace/SavedData/DB.db) and are reachable from EVERY Banker NPC using this profile,
# which is the OSRS "one bank, many branches" behaviour. Interest stays OFF (MarketPlace.cfg
# BankerIncomeMultiplier = 0) — OSRS banks pay nothing.
# DESIGN NOTE: ores and metals are included on purpose. Valheim's portal rule is about carrying
# ore through portals; OSRS has no such rule. If you want the "haul your ore home" pain back,
# delete the ore/metal lines. Names verified against the 2026-09-19 dumps; unknown names are
# silently dropped by KG, so a typo only loses that one line.
# Attach: NPC Type = Banker, Profile = bank.
