# OSRSheim biome oaths — the diary keys (KG Marketplace 10.x, authored 2026-09-21, UNTESTED)
# Docs: https://kg-marketplace.pages.dev/configs/quest-events/
# Quest events take the whole dialogue command set. AddPlayerKey calls Player.AddUniqueKey:
# a per-CHARACTER key saved on the character, not a world global key, so it never collides with
# Drop That / WIRSL / boss-key gating and each player earns their own diary.
# Every oath perk gates on HasPlayerKey, oath_<biome>. Keys are not revocable in play.
[oath_meadows_seal]
OnCompleteQuest: AddPlayerKey, oath_meadows
[oath_blackforest_seal]
OnCompleteQuest: AddPlayerKey, oath_blackforest
[oath_swamp_seal]
OnCompleteQuest: AddPlayerKey, oath_swamp
