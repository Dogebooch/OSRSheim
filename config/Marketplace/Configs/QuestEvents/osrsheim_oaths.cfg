# OSRSheim biome oaths — the diary keys (KG Marketplace 10.x, authored 2026-09-21, UNTESTED)
# Docs: https://kg-marketplace.pages.dev/configs/quest-events/
# Quest events take the whole dialogue command set. AddPlayerKey calls Player.AddUniqueKey:
# a per-CHARACTER key saved on the character, not a world global key, so it never collides with
# Drop That / WIRSL / boss-key gating and each player earns their own diary.
# Every oath perk gates on HasPlayerKey, oath_<biome>. Keys are not revocable in play.
[oath_meadows_seal]
OnCompleteQuest: AddPlayerKey, oath_meadows
[oath_blackforest_seal]
OnCompleteQuest: AddPlayerKey, oath_blackforest
[oath_swamp_seal]
OnCompleteQuest: AddPlayerKey, oath_swamp
[oath_mountain_seal]
OnCompleteQuest: AddPlayerKey, oath_mountain
[oath_plains_seal]
OnCompleteQuest: AddPlayerKey, oath_plains
[oath_mistlands_seal]
OnCompleteQuest: AddPlayerKey, oath_mistlands
[oath_ashlands_seal]
OnCompleteQuest: AddPlayerKey, oath_ashlands
[oath_deepnorth_seal]
OnCompleteQuest: AddPlayerKey, oath_deepnorth
# Elite oath seals (2026-09-24): the per-character key behind the tithe and the trimmed cape.
[oath_meadows_hard_seal]
OnCompleteQuest: AddPlayerKey, oath_meadows_hard
[oath_blackforest_hard_seal]
OnCompleteQuest: AddPlayerKey, oath_blackforest_hard
[oath_swamp_hard_seal]
OnCompleteQuest: AddPlayerKey, oath_swamp_hard
[oath_mountain_hard_seal]
OnCompleteQuest: AddPlayerKey, oath_mountain_hard
[oath_plains_hard_seal]
OnCompleteQuest: AddPlayerKey, oath_plains_hard
[oath_mistlands_hard_seal]
OnCompleteQuest: AddPlayerKey, oath_mistlands_hard
[oath_ashlands_hard_seal]
OnCompleteQuest: AddPlayerKey, oath_ashlands_hard
[oath_deepnorth_hard_seal]
OnCompleteQuest: AddPlayerKey, oath_deepnorth_hard
