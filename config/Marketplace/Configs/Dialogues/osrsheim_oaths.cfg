# OSRSheim biome oaths — dialogues (KG Marketplace 10.x, authored 2026-09-21, UNTESTED)
# Docs: https://kg-marketplace.pages.dev/configs/dialogues/
# [node] / NPC line / reply lines. Fields split on a SINGLE '|'; '||' inside one Condition = OR.
# Several Condition fields on one reply = AND. Several Command fields run in order.
# AlwaysVisible: true renders a failed reply in red and unclickable with the reason appended
# (OverrideError replaces the reason text) — that is the greyed-out locked diary row.
# AlwaysVisible: false hides a reply when any condition fails (KG default is true). Waystone rows
# are all hidden so only the one travel row that applies shows; a short-coin twin row sends to waystone_poor.
# Conditions are re-checked on click so the HasItem coin check cannot be raced.
# No commas and no '|' inside any reply Text or OverrideError.

# ===================== SIGRUN THE OATHKEEPER (town) =====================
# Type Quests / Profile oath_keeper / Dialogue oath_keeper. Hands out the oaths and their perks.
[oath_keeper]
I keep the oaths of Gielheim. Swear to a country and it will carry you.
Text: What oaths can I swear? | Command: OpenUI, Quests, oath_keeper
Text: Show me the sworn stores (swear the Meadows oath first) | Condition: NotHasPlayerKey, oath_meadows | AlwaysVisible: false | Transition: oath_keeper_help
Text: Show me the sworn stores | Condition: HasPlayerKey, oath_meadows | Condition: NotHasPlayerKey, oath_blackforest || NotGlobalKey, defeated_gdking | Command: OpenUI, Trader, oath_supplies | AlwaysVisible: false
Text: Show me the sworn stores | Condition: HasPlayerKey, oath_meadows | Condition: HasPlayerKey, oath_blackforest | Condition: GlobalKey, defeated_gdking | Condition: NotHasPlayerKey, oath_swamp || NotGlobalKey, defeated_bonemass | Command: OpenUI, Trader, oath_supplies_2 | AlwaysVisible: false
Text: Show me the sworn stores | Condition: HasPlayerKey, oath_meadows | Condition: HasPlayerKey, oath_blackforest | Condition: HasPlayerKey, oath_swamp | Condition: GlobalKey, defeated_bonemass | Condition: NotHasPlayerKey, oath_mountain || NotGlobalKey, defeated_dragon | Command: OpenUI, Trader, oath_supplies_3 | AlwaysVisible: false
Text: Show me the sworn stores | Condition: HasPlayerKey, oath_meadows | Condition: HasPlayerKey, oath_blackforest | Condition: HasPlayerKey, oath_swamp | Condition: HasPlayerKey, oath_mountain | Condition: GlobalKey, defeated_dragon | Command: OpenUI, Trader, oath_supplies_4 | AlwaysVisible: false
Text: Kneel for a sworn blessing | Condition: HasPlayerKey, oath_meadows | Command: OpenUI, Buffer, chapel_oath | AlwaysVisible: true | OverrideError: Swear the Meadows oath first
Text: How does an oath work? | Transition: oath_keeper_help
Text: Farewell | Transition: oath_keeper_bye

[oath_keeper_help]
Four deeds to a country and I will hear your oath. A sworn hand wakes the waystones of that country buys from the sworn stores and kneels cheaper here. The oath is yours alone. Your shieldmate swears their own. Once sworn a country offers its elite oath: four harder deeds that ask for skill. Swear that too and the country pays you a tithe every few days and a trimmed cape.
Text: Back | Transition: oath_keeper

[oath_keeper_bye]
Keep the oath and the country keeps you.

# ===================== WAYSTONES (town and one per sworn biome) =====================
# Type Teleporter / Profile oath_network_1 / Dialogue waystone. The same node goes on every stone.
# Exactly one travel reply can pass at a time: a tier needs its own key AND the absence of every
# higher key, so a player who skipped an earlier oath still gets one row and one fee. The network
# is cumulative by tier: a later oath carries the earlier roads even if that oath was skipped.
# The fee is charged before the map opens; closing the map without picking a pin still spends it
# (KG has no cost hook on the teleporter UI itself).
[waystone]
The stone is cold. Sworn hands make it warm.
