# OSRSheim biome oaths — dialogues (KG Marketplace 10.x, authored 2026-09-21, UNTESTED)
# Docs: https://kg-marketplace.pages.dev/configs/dialogues/
# [node] / NPC line / reply lines. Fields split on a SINGLE '|'; '||' inside one Condition = OR.
# Several Condition fields on one reply = AND. Several Command fields run in order.
# AlwaysVisible: true renders a failed reply in red and unclickable with the reason appended
# (OverrideError replaces the reason text) — that is the greyed-out locked diary row.
# Conditions are re-checked on click so the HasItem coin check cannot be raced.
# No commas and no '|' inside any reply Text or OverrideError.

# ===================== SIGRUN THE OATHKEEPER (town) =====================
# Type Quests / Profile oath_keeper / Dialogue oath_keeper. Hands out the oaths and their perks.
[oath_keeper]
I keep the oaths of Gielheim. Swear to a country and it will carry you.
Text: What oaths can I swear? | Command: OpenUI, Quests, oath_keeper
Text: Show me the sworn stores | Condition: HasPlayerKey, oath_meadows | Command: OpenUI, Trader, oath_supplies | AlwaysVisible: true | OverrideError: Swear the Meadows oath first
Text: How does an oath work? | Transition: oath_keeper_help
Text: Farewell | Transition: oath_keeper_bye

[oath_keeper_help]
Four deeds to a country and I will hear your oath. A sworn hand wakes the waystones of that country buys from the sworn stores and kneels cheaper at the hof. The oath is yours alone. Your shieldmate swears their own.
Text: Back | Transition: oath_keeper

[oath_keeper_bye]
Keep the oath and the country keeps you.

# ===================== WAYSTONES (town and one per sworn biome) =====================
# Type Teleporter / Profile oath_network_1 / Dialogue waystone. The same node goes on every stone.
# Exactly one travel reply can pass at a time: tier N requires the tier N key and the absence of
# the tier N+1 key. The fee is charged before the map opens; closing the map without picking a pin
# still spends it (KG has no cost hook on the teleporter UI itself).
[waystone]
The stone is cold. Sworn hands make it warm.
Text: The stone is silent to the unsworn | Condition: NotHasPlayerKey, oath_meadows | Transition: waystone_lore
Text: Wake the stone for 25 coins | Condition: HasPlayerKey, oath_meadows | Condition: NotHasPlayerKey, oath_blackforest | Condition: HasItem, Coins, 25 | Command: RemoveItem, Coins, 25 | Command: OpenUI, Teleporter, oath_network_1
Text: Wake the stone for 50 coins | Condition: HasPlayerKey, oath_blackforest | Condition: NotHasPlayerKey, oath_swamp | Condition: HasItem, Coins, 50 | Command: RemoveItem, Coins, 50 | Command: OpenUI, Teleporter, oath_network_2
Text: Wake the stone for 100 coins | Condition: HasPlayerKey, oath_swamp | Condition: HasItem, Coins, 100 | Command: RemoveItem, Coins, 100 | Command: OpenUI, Teleporter, oath_network_3
Text: What is this? | Transition: waystone_lore
Text: Step back | Transition: waystone_bye

[waystone_lore]
The old road runs under the world. Sigrun hears an oath and the stones of that country learn your name. They will not carry metal ore. Nothing will.
Text: Back | Transition: waystone

[waystone_bye]
The stone goes cold again.
