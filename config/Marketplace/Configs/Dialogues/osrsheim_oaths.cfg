[waystone_lore]
The old road runs under the world. Sigrun hears an oath and the stones of that country learn your name. They will not carry metal ore. Nothing will.
Text: Back | Transition: waystone

[waystone_poor]
The stone wants its coins before it wakes. Come back with the fee.
Text: Back | Transition: waystone

[waystone_bye]
The stone goes cold again.
