[herbwife_help]
Buy my seed and plant it. The rarer seed waits until a great beast has fallen and your hands know the soil. Bring me a harvest for a contract and I pay in seed sacks. I open the sacks myself: mostly seed and herbs but sometimes a stone or a bigger sack. The frontier sack hides the best of it.
Text: Show me the full page | Transition: handbook_t_herbs
Text: Brewing | Transition: handbook_t_alchemy
Text: Back | Transition: herbwife

[herbwife_lore]
Anyone can sell you a brew that barely works. What goes in the good ones comes out of your own soil or it does not come at all.
Text: Show me the full page | Transition: handbook_t_alchemy
Text: Back | Transition: herbwife

[herbwife_bye]
The ground keeps its own hours.
