# OSRSheim NPC dialogues — KG Marketplace 10.x (authored 2026-09-19, UNTESTED; renamed to Valheim lore 2026-09-21)
# Docs: https://kg-marketplace.pages.dev/configs/dialogues/
# [node] / NPC line / reply lines "Text: ... | Transition: node" or "| Command: OpenUI, Type, profile".
# Setting an NPC's Dialogue field REPLACES its type menu, so every root node has an OpenUI reply.
# OpenUI menu types assumed = NPC Type names (Trader, Banker, Quests, Gambler, Buffer, Info) — if a
# reply opens nothing, swap that line for "Command: OpenUI" (no args = the NPC's own default menu).
# No commas inside reply Text (the comma is KG's field separator). Node ids stay; only text changed.

[lumbridge_guide]
Welcome to Gielheim wanderer. I am Ulfar. Skills grind slowly here and gear must be earned.
Text: What should I know? | Transition: lumbridge_guide_help
Text: Who should I meet in Kaupang? | Transition: lumbridge_guide_town
Text: Do you have work for me? | Command: OpenUI, Quests, lumbridge_guide
Text: Farewell | Transition: lumbridge_guide_bye

[lumbridge_guide_help]
Gielheim rewards patience. Every skill climbs slowly and every weapon asks for its skill before it will obey you. Armour and jewellery anyone may wear but only a practised smith can forge them. Coins fall from nearly everything that bleeds and never from a boss. What you earn here you keep.
Text: And your quests? | Transition: lumbridge_guide_help_2
Text: Show me the full page | Transition: handbook_t_skills
Text: Back | Transition: lumbridge_guide

[lumbridge_guide_help_2]
My quests come one country at a time and new ones wake as the great beasts fall. The first ones walk you round Kaupang to meet the townsfolk. When a boss dies come back to me and each of you is paid once for it. Forget what I said and the Gielheim Guide by the square keeps the whole book.
Text: Show me the full page | Transition: handbook_t_story
Text: Who should I meet? | Transition: lumbridge_guide_town
Text: Back | Transition: lumbridge_guide_help

[lumbridge_guide_town]
Kaupang is small but every door matters. Ask me about anyone.
Text: Huntmaster Hrafn | Transition: lumbridge_guide_t_hunts
Text: Verdandi the Weaver | Transition: lumbridge_guide_t_skilling
Text: Sigrun the Oathkeeper | Transition: lumbridge_guide_t_oaths
Text: The Herbwife | Transition: lumbridge_guide_t_herbs
Text: The Shopkeeper | Transition: lumbridge_guide_t_shops
Text: Gullveig | Transition: lumbridge_guide_t_money
Text: The Gambler | Transition: lumbridge_guide_t_riddles
Text: Gothi Eirik | Transition: lumbridge_guide_t_hof
Text: The Seeress | Transition: lumbridge_guide_t_bosses
Text: Halla the Skald | Transition: lumbridge_guide_t_collection
Text: The Banker | Transition: lumbridge_guide_t_bank
Text: Back | Transition: lumbridge_guide

[lumbridge_guide_t_hunts]
Hrafn pays the jarl's bounties. Take his contracts and your blade earns gems and his trust. Enough trust and he sends you after the gods themselves.
Text: Show me the full page | Transition: handbook_t_hunts
Text: Back | Transition: lumbridge_guide_town

[lumbridge_guide_t_skilling]
Verdandi weaves fates and capes. She knows what every skill opens and pays for honest skilled work. Master a skill and she weaves you its cape.
Text: Show me the full page | Transition: handbook_t_skilling
Text: Back | Transition: lumbridge_guide_town

[lumbridge_guide_t_oaths]
Sigrun keeps the oaths. Swear to a country with four deeds and it carries you: its waystones learn your name and its stores open to you.
Text: Show me the full page | Transition: handbook_t_oaths
Text: Back | Transition: lumbridge_guide_town

[lumbridge_guide_t_herbs]
The Herbwife sells seed and pays in sacks for your harvests. The brews worth drinking grow in your own soil and nowhere else.
Text: Show me the full page | Transition: handbook_t_herbs
Text: Back | Transition: lumbridge_guide_town

[lumbridge_guide_t_shops]
The Shopkeeper sells what you need and pays little for what you do not. Nobody gets rich at his counter. That is the point.
Text: Show me the full page | Transition: handbook_t_shops
Text: Back | Transition: lumbridge_guide_town

[lumbridge_guide_t_money]
Gullveig buys gems and curios and pays better than anyone. Think before you sell: a gem in a ring can be worth more than her coin.
Text: Show me the full page | Transition: handbook_t_money
Text: Back | Transition: lumbridge_guide_town

[lumbridge_guide_t_riddles]
The Gambler dices for coin and reads the carved stones you find on the dead. Every stone pays something. Now and then it pays something nobody else will ever wear.
Text: Show me the full page | Transition: handbook_t_riddles
Text: Back | Transition: lumbridge_guide_town

[lumbridge_guide_t_hof]
Gothi Eirik blesses for bones and trophies. The gods have no use for coin.
Text: Show me the full page | Transition: handbook_t_hof
Text: Back | Transition: lumbridge_guide_town

[lumbridge_guide_t_bosses]
The Seeress sells offerings for gods you have already faced. A second summoning is a second chance at their treasure.
Text: Show me the full page | Transition: handbook_t_bosses
Text: Back | Transition: lumbridge_guide_town

[lumbridge_guide_t_collection]
Halla the Skald writes down every rare thing you find. The saga remembers what you forget and she rewards those who fill it.
Text: Show me the full page | Transition: handbook_t_collection
Text: Back | Transition: lumbridge_guide_town

[lumbridge_guide_t_bank]
The Banker keeps what you cannot carry. There is another out in the Meadows.
Text: Show me the full page | Transition: handbook_t_bank
Text: Back | Transition: lumbridge_guide_town

[lumbridge_guide_bye]
May your grind be short and your drops be rare.

[wise_old_man]
Ah a visitor. I have woven the fates of many and seen every skill mastered. Perhaps you will master one too.
Text: I have mastered a skill | Transition: skillcape_buy
Text: What does each skill open? | Transition: handbook_skills
Text: Give me skilled work | Command: OpenUI, Quests, skilling_board
Text: How does your work board pay? | Transition: wise_old_man_work
Text: Show me your finery | Command: OpenUI, Trader, vanity_tailor
Text: Tell me about the capes | Transition: wise_old_man_lore
Text: Goodbye | Transition: wise_old_man_bye

[wise_old_man_work]
My board pays for honest work: ore and timber and fish and bread and walls. Each craft has a short ladder and the higher rungs want a steadier hand. I pay in experience and carved stones. Once in a long while a small companion follows the work home.
Text: Show me the full page | Transition: handbook_t_skilling
Text: Back | Transition: wise_old_man

[wise_old_man_lore]
Each cape is proof of a skill mastered and I weave it only for one who has truly mastered it. The Allfather's cape asks for every skill mastered. My finery is for anyone with coin: it looks the part and does nothing else.
Text: Show me the full page | Transition: handbook_t_capes
Text: Back | Transition: wise_old_man

[wise_old_man_bye]
Come back when you have earned it.

[slayer_master]
So you want to hunt for the jarl. I have contracts for every biome and I pay in gems.
Text: Give me a contract | Command: OpenUI, Quests, slayer_master
Text: Rank: Blooded (10) | Condition: CustomValueMore, hunter_rank, 10, rank {current} of {value} | AlwaysVisible: true
Text: Rank: Tracker (25) | Condition: CustomValueMore, hunter_rank, 25, rank {current} of {value} | AlwaysVisible: true
