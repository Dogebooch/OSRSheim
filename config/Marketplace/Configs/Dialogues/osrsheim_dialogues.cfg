# OSRSheim NPC dialogues — KG Marketplace 10.x (authored 2026-09-19, UNTESTED; renamed to Valheim lore 2026-09-21)
# Docs: https://kg-marketplace.pages.dev/configs/dialogues/
# [node] / NPC line / reply lines "Text: ... | Transition: node" or "| Command: OpenUI, Type, profile".
# Setting an NPC's Dialogue field REPLACES its type menu, so every root node has an OpenUI reply.
# OpenUI menu types assumed = NPC Type names (Trader, Banker, Quests, Gambler, Buffer, Info) — if a
# reply opens nothing, swap that line for "Command: OpenUI" (no args = the NPC's own default menu).
# No commas inside reply Text (the comma is KG's field separator). Node ids stay; only text changed.

[lumbridge_guide]
Welcome to Gielheim wanderer. I am Ulfar. Skills grind slowly here and gear must be earned.
Text: What should I know? | Transition: lumbridge_guide_help
Text: Do you have work for me? | Command: OpenUI, Quests, lumbridge_guide
Text: Farewell | Transition: lumbridge_guide_bye

[lumbridge_guide_help]
Every weapon and armour piece needs a skill level. Coins drop from everything. The banker keeps what you cannot carry. Huntmaster Hrafn pays for kills and Verdandi the Weaver keeps the skill guide and sells each cape to whoever reaches level 100 in it. Take my boss contracts before you ring an altar.
Text: Back | Transition: lumbridge_guide

[lumbridge_guide_bye]
May your grind be short and your drops be rare.

[wise_old_man]
Ah a visitor. I have woven the fates of many and seen every skill mastered. Perhaps you will master one too.
Text: I have mastered a skill | Transition: skillcape_buy
Text: What does each skill open? | Transition: handbook_skills
Text: Give me skilled work | Command: OpenUI, Quests, skilling_board
Text: Show me your finery | Command: OpenUI, Trader, vanity_tailor
Text: Tell me about the capes | Transition: wise_old_man_lore
Text: Goodbye | Transition: wise_old_man_bye

[wise_old_man_lore]
Each cape is proof of a skill at level 100 and I weave it only for one who has reached it. The Allfather's cape demands every skill at 100. My finery is for anyone with coin: it looks the part and does nothing else.
Text: Back | Transition: wise_old_man

[wise_old_man_bye]
Come back when you have earned it.

[slayer_master]
So you want to hunt for the jarl. I have contracts for every biome and I pay in coin.
Text: Give me a contract | Command: OpenUI, Quests, slayer_master
Text: Rank: Blooded (10 contracts) | Condition: CustomValueMore, hunter_rank, 10, {current} of {value} contracts | AlwaysVisible: true
Text: Rank: Tracker (25 contracts) | Condition: CustomValueMore, hunter_rank, 25, {current} of {value} contracts | AlwaysVisible: true
Text: Rank: Hunter (50 contracts) | Condition: CustomValueMore, hunter_rank, 50, {current} of {value} contracts | AlwaysVisible: true
Text: Rank: Huntmaster's hand (100 contracts) | Condition: CustomValueMore, hunter_rank, 100, {current} of {value} contracts | AlwaysVisible: true
Text: Rank: Jarl's hunter (200 contracts) | Condition: CustomValueMore, hunter_rank, 200, {current} of {value} contracts | AlwaysVisible: true
Text: How does this work? | Transition: slayer_master_help
Text: Not today | Transition: slayer_master_bye

[slayer_master_help]
Take a contract and go kill the creatures. The contract completes where you stand. Come back for another one whenever you like. Harder biomes unlock as you defeat the bosses. Every contract raises your rank with me and at 25 50 100 and 200 I trust you with elite hunts.
Text: Back | Transition: slayer_master

[slayer_master_bye]
Sharpen your blade.

[banker]
Good day. Would you like to access your vault?
Text: Yes please | Command: OpenUI, Banker, bank
Text: No thanks | Transition: banker_bye

[banker_bye]
Have a nice day.

