Text: Rank: Jarl's hunter (200) | Condition: CustomValueMore, hunter_rank, 200, rank {current} of {value} | AlwaysVisible: true
Text: Boss kill counts | Transition: slayer_master_kc
Text: How does this work? | Transition: slayer_master_help
Text: Not today | Transition: slayer_master_bye

[slayer_master_help]
Take a contract and kill what it names. It completes where you stand and I have another ready the moment you finish. The far countries open to my contracts as their gatekeepers fall. I pay in gems. A contract beneath you I will take back for its worth in coin.
Text: And my rank? | Transition: slayer_master_help_2
Text: Show me the full page | Transition: handbook_t_hunts
Text: Back | Transition: slayer_master

[slayer_master_help_2]
Every contract raises your rank with me and the big hunts raise it faster. As your rank climbs I trust you with elite hunts and then with the gods themselves. Hunt as a group and every kill within shouting distance counts for each of you. Alone only your own kills count.
Text: Show me the full page | Transition: handbook_t_hunts
Text: Back | Transition: slayer_master_help

[slayer_master_kc]
Every boss you fell on my boss hunts. A group kill counts for each of you.
Text: Eikthyr | Condition: CustomValueMore, kc_eikthyr, 100000, {current} kills | AlwaysVisible: true
Text: The Elder | Condition: CustomValueMore, kc_elder, 100000, {current} kills | AlwaysVisible: true
