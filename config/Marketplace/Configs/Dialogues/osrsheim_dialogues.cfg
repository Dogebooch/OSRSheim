Text: What do you buy? | Transition: shopkeeper_buys
Text: No thanks | Transition: shopkeeper_bye

[shopkeeper_buys]
Hides pelts and trophies mostly. Wood stone and resin if you have too much of it.
Text: Back | Transition: shopkeeper

[shopkeeper_bye]
Come back soon.

[gem_trader]
Gullveig here. Gems gold and silver. I pay better than that bald fellow with the lox.
Text: Let me see your prices | Command: OpenUI, Trader, gem_trader
Text: Goodbye | Transition: gem_trader_bye

[gem_trader_bye]
Bring me rubies.

[gambler]
Fancy a roll? House always wins. Mostly.
Text: Let us dice | Command: OpenUI, Gambler, dice_bag
Text: Open the crystal chest | Command: OpenUI, Gambler, crystal_chest
Text: I found a riddle-stone | Transition: gambler_riddles
Text: Walk away | Transition: gambler_bye

[gambler_riddles]
Stones with runes on them. I read them for a living. Hand it over.
Text: Scratched stone | Command: OpenUI, Gambler, riddle_simple
Text: Whispering stone | Command: OpenUI, Gambler, riddle_cryptic
Text: Bound stone | Command: OpenUI, Gambler, riddle_elaborate
Text: Allfather's stone | Command: OpenUI, Gambler, riddle_master
Text: Back | Transition: gambler

[gambler_bye]
Your loss. Literally.

[chapel]
Kneel at the altar and I will grant you a blessing for a small offering.
Text: Bless me | Command: OpenUI, Buffer, chapel
Text: Not now | Transition: chapel_bye

[chapel_bye]
Odin watch over you.

[seeress]
I read the bones. For coin I can give you what the old altars hunger for. Only what you have carried before.
Text: The altars have not answered you yet | Condition: NotGlobalKey, defeated_eikthyr | AlwaysVisible: false | Transition: seeress_lore
Text: Show me the offerings | Condition: GlobalKey, defeated_eikthyr | Condition: NotGlobalKey, defeated_gdking | Condition: NotGlobalKey, defeated_bonemass | Condition: NotGlobalKey, defeated_goblinking | Command: OpenUI, Trader, offerings | AlwaysVisible: false
Text: Show me the offerings | Condition: GlobalKey, defeated_gdking | Condition: NotGlobalKey, defeated_bonemass | Condition: NotGlobalKey, defeated_goblinking | Command: OpenUI, Trader, offerings_2 | AlwaysVisible: false
Text: Show me the offerings | Condition: GlobalKey, defeated_bonemass | Condition: NotGlobalKey, defeated_goblinking | Command: OpenUI, Trader, offerings_3 | AlwaysVisible: false
Text: Show me the offerings | Condition: GlobalKey, defeated_goblinking | Command: OpenUI, Trader, offerings_4 | AlwaysVisible: false
Text: Why sell these? | Transition: seeress_lore
Text: Leave | Transition: seeress_bye

[seeress_lore]
Every god you have summoned once will answer again. The drop that eluded you waits behind another offering.
Text: Back | Transition: seeress

[seeress_bye]
The gods are patient. Are you?

[herbwife]
Seeds I have. Patience you will need to find elsewhere.
Text: What do you sell? | Condition: NotGlobalKey, defeated_bonemass | Condition: NotGlobalKey, defeated_dragon | Command: OpenUI, Trader, herbwife | AlwaysVisible: false
Text: What do you sell? | Condition: GlobalKey, defeated_bonemass | Condition: NotGlobalKey, defeated_dragon | Command: OpenUI, Trader, herbwife_2 | AlwaysVisible: false
Text: What do you sell? | Condition: GlobalKey, defeated_dragon | Command: OpenUI, Trader, herbwife_3 | AlwaysVisible: false
Text: Why not sell the crop? | Transition: herbwife_lore
Text: Another time | Transition: herbwife_bye

[herbwife_lore]
Anyone can sell you a brew that barely works. What goes in the good ones comes out of your own soil or it does not come at all.
Text: Back | Transition: herbwife

[herbwife_bye]
The ground keeps its own hours.
