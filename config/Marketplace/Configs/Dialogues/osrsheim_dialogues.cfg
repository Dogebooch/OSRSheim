[seeress_lore]
Every god you have summoned once will answer again. The drop that eluded you waits behind another offering.
Text: Show me the full page | Transition: handbook_t_bosses
Text: Back | Transition: seeress

[seeress_bye]
The gods are patient. Are you?

[herbwife]
Seeds I have. Patience you will need to find elsewhere. Work too if your rows are straight.
