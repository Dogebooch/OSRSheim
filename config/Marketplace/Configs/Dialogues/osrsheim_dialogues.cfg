Text: Moder | Condition: CustomValueMore, kc_moder, 100000, {current} kills | AlwaysVisible: true
Text: Yagluth | Condition: CustomValueMore, kc_yagluth, 100000, {current} kills | AlwaysVisible: true
Text: The Queen | Condition: CustomValueMore, kc_queen, 100000, {current} kills | AlwaysVisible: true
Text: Fader | Condition: CustomValueMore, kc_fader, 100000, {current} kills | AlwaysVisible: true
Text: The Frost King | Condition: CustomValueMore, kc_frostking, 100000, {current} kills | AlwaysVisible: true
Text: Back | Transition: slayer_master

[slayer_master_bye]
Sharpen your blade.

[banker]
Good day. Would you like to access your vault?
Text: Yes please | Command: OpenUI, Banker, bank
Text: How does the vault work? | Transition: banker_help
Text: No thanks | Transition: banker_bye

[banker_help]
Your vault waits behind any banker. There is one of us here and another out in the Meadows. Whatever you cannot carry we keep safe.
Text: Show me the full page | Transition: handbook_t_bank
Text: Back | Transition: banker

[banker_bye]
May your hoard grow.

[shopkeeper]
Hail wanderer. Come in out of the wind and see what I have.
