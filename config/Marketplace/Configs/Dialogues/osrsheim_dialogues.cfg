# OSRSheim NPC dialogues — KG Marketplace 10.x (authored 2026-09-19, UNTESTED; renamed to Valheim lore 2026-09-21)
# Docs: https://kg-marketplace.pages.dev/configs/dialogues/
# [node] / NPC line / reply lines "Text: ... | Transition: node" or "| Command: OpenUI, Type, profile".
# Setting an NPC's Dialogue field REPLACES its type menu, so every root node has an OpenUI reply.
# OpenUI menu types assumed = NPC Type names (Trader, Banker, Quests, Gambler, Buffer, Info) — if a
# reply opens nothing, swap that line for "Command: OpenUI" (no args = the NPC's own default menu).
# No commas inside reply Text (the comma is KG's field separator). Node ids stay; only text changed.

[lumbridge_guide]
Welcome to Gielheim wanderer. I am Ulfar. Skills grind slowly here and gear must be earned.
Text: What should I know? | Transition: lumbridge_guide_help
Text: Do you have work for me? | Command: OpenUI, Quests, lumbridge_guide
Text: Farewell | Transition: lumbridge_guide_bye

[lumbridge_guide_help]
Every weapon and armour piece needs a skill level. Coins drop from everything. The banker keeps what you cannot carry. Huntmaster Hrafn pays for kills and Verdandi the Weaver sells capes to those who reach level 100.
Text: Back | Transition: lumbridge_guide

[lumbridge_guide_bye]
May your grind be short and your drops be rare.

[wise_old_man]
Ah a visitor. I have woven the fates of many and seen every skill mastered. Perhaps you will master one too.
Text: I have mastered a skill | Command: OpenUI, Trader, skillcape_shop
Text: Tell me about the capes | Transition: wise_old_man_lore
Text: Goodbye | Transition: wise_old_man_bye

[wise_old_man_lore]
Each cape is proof of a skill at level 100. You may buy one earlier but you will not be able to wear it. The Allfather's cape demands every skill at 100.
Text: Back | Transition: wise_old_man

[wise_old_man_bye]
Come back when you have earned it.

[slayer_master]
So you want to hunt for the jarl. I have contracts for every biome and I pay in coin.
Text: Give me a contract | Command: OpenUI, Quests, slayer_master
Text: How does this work? | Transition: slayer_master_help
Text: Not today | Transition: slayer_master_bye

[slayer_master_help]
Take a contract and go kill the creatures. The contract completes where you stand. Come back for another one whenever you like. Harder biomes unlock as you defeat the bosses.
Text: Back | Transition: slayer_master

[slayer_master_bye]
Sharpen your blade.

[banker]
Good day. Would you like to access your vault?
Text: Yes please | Command: OpenUI, Banker, bank
Text: No thanks | Transition: banker_bye

[banker_bye]
Have a nice day.

[shopkeeper]
Can I help you at all?
Text: What are you selling? | Command: OpenUI, Trader, general_store
Text: Ammunition and brews? | Command: OpenUI, Trader, supplies
Text: What do you buy? | Transition: shopkeeper_buys
Text: No thanks | Transition: shopkeeper_bye

[shopkeeper_buys]
Hides pelts and trophies mostly. Wood stone and resin if you have too much of it.
Text: Back | Transition: shopkeeper

[shopkeeper_bye]
Come back soon.

[gem_trader]
Gullveig here. Gems gold and silver. I pay better than that bald fellow with the lox.
Text: Let me see your prices | Command: OpenUI, Trader, gem_trader
Text: Goodbye | Transition: gem_trader_bye

[gem_trader_bye]
Bring me rubies.

[gambler]
Fancy a roll? House always wins. Mostly.
Text: Let us dice | Command: OpenUI, Gambler, dice_bag
Text: Open the crystal chest | Command: OpenUI, Gambler, crystal_chest
Text: I found a riddle-stone | Transition: gambler_riddles
Text: Walk away | Transition: gambler_bye

[gambler_riddles]
Stones with runes on them. I read them for a living. Hand it over.
Text: Scratched stone | Command: OpenUI, Gambler, riddle_simple
Text: Whispering stone | Command: OpenUI, Gambler, riddle_cryptic
Text: Bound stone | Command: OpenUI, Gambler, riddle_elaborate
Text: Allfather's stone | Command: OpenUI, Gambler, riddle_master
Text: Back | Transition: gambler

[gambler_bye]
Your loss. Literally.

[chapel]
Kneel at the altar and I will grant you a blessing for a small offering.
Text: Bless me | Command: OpenUI, Buffer, chapel
Text: Not now | Transition: chapel_bye

[chapel_bye]
Odin watch over you.

[seeress]
I read the bones. For coin I can give you what the old altars hunger for. Only what you have carried before.
Text: Show me the offerings | Command: OpenUI, Trader, offerings
Text: Why sell these? | Transition: seeress_lore
Text: Leave | Transition: seeress_bye

[seeress_lore]
Every god you have summoned once will answer again. The drop that eluded you waits behind another offering.
Text: Back | Transition: seeress

[seeress_bye]
The gods are patient. Are you?
