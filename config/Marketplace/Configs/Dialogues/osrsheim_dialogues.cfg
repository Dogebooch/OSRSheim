[herbwife_sacks]
Every sack holds what the rows gave back. Most of it is seed. Some of it is not.
Text: Garden seed sack | Condition: HasItem, OSRS_SeedSackGarden, 1 | Command: OpenUI, Gambler, sack_garden | AlwaysVisible: true | OverrideError: You carry no garden seed sack
Text: Field seed sack | Condition: HasItem, OSRS_SeedSackField, 1 | Command: OpenUI, Gambler, sack_field | AlwaysVisible: true | OverrideError: You carry no field seed sack
