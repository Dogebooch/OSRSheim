[shopkeeper_buys]
Hides pelts and trophies mostly. Wood stone and resin if you have too much of it. I pay little and sell dear so nobody grows rich at this counter. My shelves fill as the great beasts fall.
Text: Show me the full page | Transition: handbook_t_shops
Text: Back | Transition: shopkeeper

[shopkeeper_bye]
Come back soon.

[gem_trader]
Gullveig here. Gems gold and silver. I pay better than that bald fellow with the lox.
Text: Let me see your prices | Command: OpenUI, Trader, gem_trader
Text: What are gems good for? | Transition: gem_trader_help
Text: Goodbye | Transition: gem_trader_bye

[gem_trader_help]
Gems fall from the dead and from stone if you swing long enough. Sell them to me or take them to a forge: a ring or a torc or a bolt tip is worth more to the right hand than my coin. Geodes and burls I buy too. Bring me both halves of a hoard key and I will join them.
Text: Show me the full page | Transition: handbook_t_money
Text: Jewellery and bolts | Transition: handbook_t_jewellery
Text: Back | Transition: gem_trader

[gem_trader_bye]
Bring me rubies.

[gambler]
Fancy a roll? House always wins. Mostly.
Text: Let us dice | Command: OpenUI, Gambler, dice_bag
Text: Open the hoard | Command: OpenUI, Gambler, crystal_chest
Text: I found a riddle-stone | Transition: gambler_riddles
Text: How do the stones work? | Transition: gambler_help
Text: Walk away | Transition: gambler_bye

[gambler_help]
Carved stones fall from the dead and the harder the country the finer the stone. Hand me one and I read it: coin or gems or a hoard key or the next stone up. Now and then a cloak or a crown nobody else will ever wear. A whole hoard key opens my hoard.
Text: Show me the full page | Transition: handbook_t_riddles
Text: Back | Transition: gambler

[gambler_riddles]
Stones with runes on them. I read them for a living. Hand it over.
Text: Scratched stone | Command: OpenUI, Gambler, riddle_simple
Text: Whispering stone | Command: OpenUI, Gambler, riddle_cryptic
Text: Bound stone | Command: OpenUI, Gambler, riddle_elaborate
Text: Allfather's stone | Command: OpenUI, Gambler, riddle_master
Text: Back | Transition: gambler

[gambler_bye]
Your loss. Literally.

[chapel]
Kneel at the altar and I will grant you a blessing for a small offering.
Text: Bless me | Command: OpenUI, Buffer, chapel
Text: How do blessings work? | Transition: chapel_help
Text: Not now | Transition: chapel_bye

[chapel_help]
The gods take bones and trophies and never coin. Bone fragments buy the small blessings. Old bone and the trophies of strong beasts buy the great ones. You may hold one blessing of each kind at once: a ward and a might and a vigour and more besides.
Text: Show me the full page | Transition: handbook_t_hof
Text: Back | Transition: chapel

[chapel_bye]
Odin watch over you.

[seeress]
I read the bones. For coin I can give you what the old altars hunger for. Only what you have carried before.
