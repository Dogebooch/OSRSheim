Text: <color=#c77dff>Mining: Amber 1 in 80 to 1 in 256 an action</color>
Text: <color=#ffb300>Mining: Amber pearl 1 in 256 an action</color>
Text: <color=#ffb300>Mining: Ruby 1 in 256 to 1 in 370 an action</color>
