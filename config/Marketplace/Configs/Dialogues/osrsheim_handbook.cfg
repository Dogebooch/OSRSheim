[handbook_t_alchemy]
Brewing. Carrot and turnip make a potion base at the alchemy table once it is upgraded once. Brew from the base at the same table.\nLesser vials are open to everyone. Stronger brews need Alchemy. The skill guide lists the level for each brew.\nNo trader sells Alchemy brews. Grow them yourself.
