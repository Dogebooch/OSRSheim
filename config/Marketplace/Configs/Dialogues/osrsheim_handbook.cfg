[handbook_t_magic]
Magic gear and treasure. Two-star creatures sometimes drop magic gear. A treasure-map chest holds coin and a gem or a magic item.\nBoss and elite uniques are legendaries with a teal beam. Each does one thing no other item does.\nThe enchanting table is off. Magic gear is found and never made. Haldor sells treasure maps and bounties: dig up the chest at the mark.
Text: Who: Haldor and the wilds
Text: See also: Bosses | Transition: handbook_t_bosses
Text: Back | Transition: handbook_topics

[handbook_t_hof]
The hof. The gothi takes bones and trophies and never coin. Bone fragments buy the lesser blessings. Withered bone and charred bone and trophies buy the strong ones.\nOne blessing from each group at a time. Blessings from different groups stack.\nSworn hands kneel before Sigrun for the entry blessings at a lower bone cost.
Text: Who: Gothi Eirik
