[handbook_t_skills]
Skills and gear. Every skill climbs slowly toward 100. You never lose levels when you die.\nWeapons need their weapon skill to wield. Shields need Blocking to wear. Armour and shields and jewellery need Blacksmithing to craft but anyone may wear them. Picks need Mining and hatchets need Lumberjacking. Brews need Alchemy.\nA gate opens something new to do. It never hands you a bigger number. The skill guide lists every gate and lights the ones you have passed.
Text: Who: Verdandi the Weaver keeps the skill guide
