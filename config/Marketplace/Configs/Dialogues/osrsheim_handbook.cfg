[handbook_t_riddles]
Riddle-stones and hoards. Carved stones drop from kills. Raid attackers and elites drop them more often. Each boss pays each of you one when you report its fall to Ulfar and Hrafn's boss hunts pay one each time.\nShow a stone to the Gambler. Each stone pays one prize: coin or gems or a hoard key or the next stone up or a rare cloak or crown. Cloaks and crowns carry no stats. Wear them from the vanity panel.\nGullveig joins the two halves of a hoard key. The Gambler opens the hoard with the whole key.
