[handbook_t_money]
Coin and trade. Coins drop from almost every creature but never from a boss. Hunt and herb contracts pay in gems and seeds.\nThe Shopkeeper sells basics dear and buys trophies and junk cheap so there is no trading loop. Gullveig buys gems and curios. Gems also go into jewellery and bolts: think before you sell.\nCoin buys supplies you have already found and offerings for bosses you have already summoned. It never buys raw power.
