[handbook_t_hunts]
Hunts. Take a contract and kill what it names. The contract completes where you stand and another is ready at once. Each biome's contracts open when the boss before it falls.\nContracts pay gems and raise your hunter rank. Higher ranks open elite and boss hunts. Dropping a contract costs its pay in coins.\nHunt with your party and every kill near you counts for each of you. Alone only your own kills count.
