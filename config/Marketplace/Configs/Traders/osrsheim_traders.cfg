Coins, 140, MeadBaseEitrMountain_TW, 1


# ===================== HERBWIFE (seeds only) =====================
# The herb run: seeds are cheap, the grow timer is the gate, the crop is never
# sold back. Price tiers the ladder; the biome does the rest (Barley and Flax
# refuse to plant outside the Plains below Farming 50).
# No discovery gate: a seed shop you cannot buy your first seed from is useless.
[herbwife]
Coins, 10, CarrotSeeds, 3
Coins, 15, TurnipSeeds, 3
Coins, 25, OnionSeeds, 3
