# ===================== SWORN STORES (Sigrun the Oathkeeper) =====================
# Biome-oath perk (OSRS diary shop). The dialogue reply is key-gated (HasPlayerKey oath_meadows);
# "= true" is kept ON TOP of that so an oath can never hand a Meadows player a tier they have not
# reached — the discovery gate still applies per line. Bulk bundles at ~7% under the supplies page;
# no gear and nothing WIRSL gates, so the oath buys convenience and never progression.
[oath_supplies = true]
Coins, 140, ArrowFlint, 50
Coins, 190, ArrowFire, 50
Coins, 380, ArrowIron, 50
Coins, 380, ArrowObsidian, 50
Coins, 40, FishingBait, 100
