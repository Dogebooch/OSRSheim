# ===================== OFFERINGS (the Seeress) =====================
# Coin sink that feeds the unique grind: buy boss offerings, resummon, roll again.
# "= true" = discovery gate: a line shows only once the player has picked that item up, so a boss
# must be summoned the honest way once. A full summon costs 2.5-2.8x the boss coin purse (drops.csv)
# so resummoning can never print coins. Fader and Kall offerings are never sold.
# DragonEgg (Moder, 3 a summon, ~700c) and DvergrKeyFragment (Queen) wait on a wackydb dump.
[offerings = true]
Coins, 400, TrophyDeer, 1
Coins, 400, AncientSeed, 1
# Bonemass summon material. Priced with the other offerings, NOT at bone value: WitheredBone
# is the Swamp prayer currency (Buffersosrsheim_prayers.cfg) and must be farmed, not bought.
Coins, 400, WitheredBone, 1
Coins, 500, GoblinTotem, 1

