# OSRSheim herb contracts (farming pass 2026-09-25), KG Marketplace 10.x, UNTESTED. The herbwife hands them out
# (dialogue herbwife -> OpenUI, Quests, herb_contracts); they left the Huntmaster's board. The Farming Guild loop:
# a crop ladder by boss key and Farming level, paid in seed sacks (Gamblers\osrsheim_gamblers.cfg sack_*, opened
# from her dialogue) plus raw Farming XP (Skill_EXP skips every gain factor). No coins: repeatables pay items.
# Tiers: garden (carrot/turnip/onion) -> garden sack; field (barley/flax, mist mushrooms, vines) -> field sack;
# frontier (kale/poteitr/oat) -> frontier or field sack, 1 in 2 (RandomItem): the frontier sack holds the rares
# at 1 in 21, so its supply sets their rate (sim: about 0.5 each per player-run). Harvest counts any Pickable via Pickable.RPC_Pick by prefab
# name, so own plots count (validate-configs checks the target is a Pickable). Cooldown 2 = two in-game days,
# about one grow cycle. XP tuned so sim run-end Farming stays 80-86 (sim-run.py).

