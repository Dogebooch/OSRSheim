# OSRSheim skilling contracts (2026-09-24), KG Marketplace 10.x, UNTESTED. Verdandi the Weaver hands them out
# (dialogue wise_old_man -> OpenUI, Quests, skilling_board). The Tempoross / Mahogany Homes loop: gathering and
# crafting pay loot, not coins. Tiers by skill level (SkillMore 20/40/60; KG resolves Smoothbrain names by hash)
# and the boss key that makes the goods reachable. Collect removes the goods when handed in (a resource sink).
# Build counts pieces placed while the contract is open; targets are vanilla hammer prefabs (game-data pieces.json).
# Reward: a riddle-stone (tiers 1-2: simple, tier 3: cryptic). Fishing and Farming tier 3 roll a RandomItem pool: 39 riddle-stones
# and 1 skilling pet (uniform pool: Farming 1 in 40; Fishing 1 in 20, its tier 3 comes late), the only source of those pets.
# Cooldown 20 = twenty in-game days of world clock (~10 h): about one of each per long session. Talk targets and quest ids: see the header of
# osrsheim_quests_slayer.cfg. Only sim-tracked skills (validate-configs.py).

