# OSRSheim story quests, biome chains (KG Marketplace 10.x, authored 2026-09-21, UNTESTED)
# Companion to osrsheim_quests_free.cfg (same giver: Ulfar the Guide, profile lumbridge_guide).
# Docs: https://kg-marketplace.pages.dev/configs/quests/  conditions: /concepts/conditions/
# Block: [id[ = Tag]] / Type / Title / Description / Target / Rewards / Cooldown / [Conditions]
# Tag HiddenAnyCondition = hidden until its condition passes (Ulfar lists only what is open).
# Tag HiddenOtherQuestCondition = hidden until the QuestFinished quest is done.
# Cooldown 36500 = one-time. Kill "creature, N, 0" = any star. Craft "item, 1, 1" = quality 1.
# Boss quests unlock on the PREVIOUS boss key: take them before ringing the altar.
# Rewards: coins by biome band, a material or consumable, Skill_EXP on the skill the quest used.
# TEST ITEMS: Pet reward (misthalin_mystery, wolf_whistle, cold_war), Harvest type (druidic_ritual),
#   Skill_EXP on a SkillManager skill (dorics_quest in the free cfg), Hidden* tags, Talk to Gullveig.
# Prefabs verified against reference\verified-prefab-names.json. No commas inside text lines.

