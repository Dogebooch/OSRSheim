# ===================== ELITE OATHS (2026-09-24) =====================
# The second diary tier: four tasks per biome that need skill levels (KG SkillMore; DLL: vanilla names or
# SkillManager's hash, so Smoothbrain skills resolve by name), then a hard seal. Early biomes ask for 30-45,
# so their elite oath is revisit work for the later run. Only sim-tracked skills (sim-run.py sizes them).
# Seal -> QuestEvents AddPlayerKey oath_<biome>_hard -> the trimmed cape and the tithe below.
# The seal is named oath_<biome>_hard_seal so sim-run.py grants oath_<biome>_hard and logs a tier-3 moment.
# Tithe: repeatable Talk quest, cooldown 6 in-game days (~3 h of world clock), pays the biome tier's riddle-stone.

