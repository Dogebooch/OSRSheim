# OSRSheim biome oaths — achievement diaries (KG Marketplace 10.x, authored 2026-09-21, UNTESTED)
# Docs: https://kg-marketplace.pages.dev/configs/quests/
# Block: [id[ = Tag]] / Type / Title / Description / Target / Rewards / Cooldown / [Conditions]
# Giver: Sigrun the Oathkeeper (Type Quests, Profile oath_keeper, Dialogue oath_keeper).
# Four PARALLEL tasks per biome, all visible at once (OSRS diaries never hide a task behind a task),
# then a seal quest tagged HiddenOtherQuestCondition and gated on all four.
# The condition line is ONE line split on '|' = AND ('||' inside one group = OR).
# Talk targets carry NO quotes: KG compares the raw NPC name override, spaces kept
# (Quests_Main_Server.ParseTargets skips space-stripping for Talk and never strips quotes).
# The seal grants the diary key in QuestEvents\osrsheim_oaths.cfg (AddPlayerKey, oath_<biome>);
# every perk downstream gates on HasPlayerKey, never on the four quest ids.
# Prefabs verified against reference\verified-prefab-names.json and the BepInEx\Debug dumps.
# No commas inside text lines.

