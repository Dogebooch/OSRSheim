# OSRSheim hunt contracts (Slayer tasks), KG Marketplace 10.x (authored 2026-09-19, board expanded 2026-09-21, UNTESTED)
# Repeatable kill tasks from the Huntmaster. "= Autocomplete" completes where you stand; cooldown 60s = back-to-back.
# Elites pay per kill what 5-10 commons do.
# Camped (SpawnArea-fed) tasks: count >= ~14 min at 321 kills/hr x the target's SpawnArea weight share, pay = 1.25x the biome coin/hr
# target for that time (research\loot.md §7).
# Gated by the boss key that opens the biome. Superior contracts use min star 2 (Kill "creature, 1, 2"):
#   only Spawn That superiors carry stars (§12), so they are the only match; gated on their spawner key (500-505). TEST: the star field semantics.
# NPC: Type = Quests, Profile = slayer_master, Dialogue = slayer_master, Name Override = Huntmaster Hrafn.
# Skip fee per contract: QuestEvents\osrsheim_slayer_skip.cfg (a third of the coin pay).

