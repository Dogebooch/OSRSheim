# OSRSheim hunt contracts (Slayer tasks) — KG Marketplace 10.x (authored 2026-09-19, UNTESTED)
# Repeatable kill tasks from the Huntmaster. "= Autocomplete" completes the task where you stand
# (no walk back), cooldown 60s = effectively back-to-back like OSRS. Coin rewards sit just above
# EpicLoot's bounty payouts for the same biome so a task is always worth taking.
# Gated by the boss key that opens the biome, so a task never sends you somewhere you cannot go.
# NPC: Type = Quests, Profile = slayer_master, Dialogue = slayer_master, Name Override = Huntmaster Hrafn.

