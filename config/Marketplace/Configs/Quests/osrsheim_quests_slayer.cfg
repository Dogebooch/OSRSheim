# OSRSheim hunt contracts (Slayer tasks), KG Marketplace 10.x (authored 2026-09-19, board expanded 2026-09-21, UNTESTED)
# Repeatable kill tasks from the Huntmaster. "= Autocomplete" completes where you stand; cooldown 60s = back-to-back.
# Pay = the frontier gem (Amber / AmberPearl / Ruby / SilverNecklace by boss key) worth a third of 2x the kills' coin EV
# at Gullveig, min 1, merged with the old gem; hunter_rank + that coin EV / 100 (min 1). No coins (2026-09-24).
# Camped (SpawnArea-fed) tasks: count >= ~14 min at 321 kills/hr x the target's SpawnArea weight share.
# Gated by the boss key that opens the biome. Two-star contracts (Kill "creature, 1, 2" = 2+ stars; DLL: TargetLevel = field + 1)
#   match any two-star: CLLC's natural 1% and the Spawn That superiors alike. Priced as a 40c contract (1-2 gems).
# NPC: Type = Quests, Profile = slayer_master, Dialogue = slayer_master, Name Override = Huntmaster Hrafn.
# Skip fee per contract: QuestEvents\osrsheim_slayer_skip.cfg (the pay's value in coins at Gullveig).

