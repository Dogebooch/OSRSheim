# OSRSheim blessings ("prayers"; renamed to Valheim lore 2026-09-21) — KG Marketplace Buffer configs (authored 2026-09-19, UNTESTED)
# Docs: https://kg-marketplace.pages.dev/configs/buffers/
# Block layout (positional, 8 lines): [id] / Display name / Duration seconds / Icon /
#   Cost item, amount / Modifier = value, ... / VFX prefab / Group.
# Modifier keys from the docs: ModifyAttack, ModifyHealthRegen, ModifyStaminaRegen, ModifyRaiseSkills,
#   ModifySpeed, ModifyNoise, ModifyMaxCarryWeight, ModifyStealth, RunStaminaDrain, DamageReduction.
#   Values assumed to be fractions (0.3 = +30%). UNVERIFIED — check the buff tooltip in game.
# Icon = an item prefab (assumed accepted; docs show a sprite name). VFX "none" = no effect prefab.
# Same group = mutually exclusive, like OSRS overhead prayers.

