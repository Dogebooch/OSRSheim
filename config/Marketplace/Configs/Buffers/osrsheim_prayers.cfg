# OSRSheim prayers -- KG Marketplace Buffer configs. Cost is BONES, not coins (Prayer skill, sec 4).
# Docs: https://kg-marketplace.pages.dev/configs/buffers/
# Verified against kg.Marketplace.dll 2026-09-21 (Marketplace.Modules.Buffer):
#   Block = [id] then 7 lines: Name / Duration s / Icon prefab / Cost prefab, count /
#   Modifiers / VFX prefab / Group. Parser reads i+1..i+6 RAW: no blank line or # inside a block.
#   Cost prefab must have an ItemDrop (Init dereferences it unguarded). One cost item only.
#   Cost is matched and removed by DISPLAY NAME, not prefab: never give a clone a base item's name.
#   Group is mandatory (CanTake returns false if empty) and is drawn as a yellow UI header.
#   Same group = mutually exclusive. Different groups stack.
# Multipliers (BufferMain): ModifyAttack / HealthRegen / StaminaRegen / RaiseSkills / Speed /
#   Noise / Stealth / RunStaminaDrain default 1.0, so 1.1 = +10% and 0.1 would be -90%.
#   DamageReduction is a raw fraction, applied as Clamp01(1 - x). MaxCarryWeight is ADDITIVE.
# Collection log: log a trophy at Halla BEFORE spending it here; the unlock is HasItem and
# spending your only copy postpones the row until the next drop.
# Bone ladder: BoneFragments (Meadows, every skeleton 100%) -> TrophySkeleton (BF 10%) ->
#   WitheredBone / TrophyDraugrElite (Swamp) -> TrophyFenring (Mountain) -> TrophyLox (Plains) ->
#   TrophySeeker (Mistlands) -> CharredBone / TrophyFallenValkyrie (Ashlands).

