# OSRSheim in-game rulebook — an Info-type NPC (or DistancedUI) shows this page.
# Docs: https://kg-marketplace.pages.dev/configs/server-infos/
# NPC: Type = Info, Profile = gielheim_guide, Name Override = Gielheim Guide
[gielheim_guide]
WELCOME TO GIELHEIM — the tenth world, played as a long grind.

SKILLS
- Skills grind at half speed toward 100 (Mining and Lumberjacking slower still) and you never lose levels on death.
- Gear is gated: weapons need their weapon skill, shields need Blocking to wear, and armour, shields and jewellery need Blacksmithing to craft. Armour and jewellery are free to wear. Picks need Mining, hatchets need Lumberjacking, brews need Alchemy.
- Bronze 15, iron 20, silver and wolf 30, black metal and padded 40, Mistlands 50. Ashlands: weapons 55, armour 60. Deep North: weapons 60, armour 65. Shields need Blocking 15-40 to wear.

MONEY
- Coins drop from almost everything. Rare gem drops (amber, pearls, rubies, necklaces) land between 1 in 128 and 1 in 512 kills.
- Sell trophies and junk at the general store and gems to Gullveig. Bank at any banker. Gems also go into jewellery, so think before you sell.
- Spend it: the shopkeeper stocks arrows and mage brews you have already found, and dropping a hunt contract costs its pay's worth in coins.
- Two-star creatures sometimes drop magic gear (4%) and a treasure-map chest can hold a magic item. Boss and elite uniques are legendaries. Haldor sells treasure maps and bounties.

HUNTS AND TREASURE
- Huntmaster Hrafn hands out repeatable kill contracts that pay gems, and every two days he pays seeds for crop deliveries.
- Ulfar the Guide gives one-time story quests for every biome. New ones appear as bosses fall. When a boss dies each of you reports to Ulfar once for the jarl's reward.
- Haldor sells treasure maps. Dig up the chest at the mark.

RIDDLE-STONES
- Carved stones drop from kills. Scratched: Meadows to Mountain. Whispering: Plains onward. Bound: elites, Swamp to Mistlands. Allfather's: elites in the Ashlands and Deep North.
- Raid attackers and elites drop them more often. Each boss pays each of you one when you report its fall to Ulfar, and Hrafn's boss hunts pay one each time.
- Show a stone to the Gambler: "I found a riddle-stone". Each stone pays one prize: coin, gems, a hoard key, the next stone up, or a rare cloak or crown.
- Cloaks and crowns carry no stats. Wear them over your armour from the vanity panel.

BIOME OATHS
- Sigrun the Oathkeeper sets four tasks for each biome. Meadows is open from the start; each later biome opens once the boss before it is dead.
- Finish all four tasks, then seal the oath for coin and the biome's oath cape. Oaths belong to your character, not the world.
- Your first sealed oath opens the sworn stores (bundles of goods you have already found, a little cheaper) and the sworn blessings (fewer bones).
- Waystones carry you between sworn biomes. The fee is 25c to 500c by your highest oath and is spent when the map opens, even if you do not travel. Waystones will not carry ore.

GATHERING
- Every rock segment and every felled tree rolls for a rare find. Chances are per action, not per hour: more rocks, more rolls.
- Mining: gems at 1 in 256 a segment, a cracked geode at 1 in 500 a rock, and the pet Grit, about one per 220 hours of mining.
- Woodcutting: a knotted burl at 1 in 500 a tree, and the pet Splinter, about one per 210 hours of chopping.
- Geodes and burls sell to Gullveig for 35c.

THE HERB RUN
- The Herbwife sells carrot, turnip and onion seeds. Barley and flax grow from wild Plains plants.
- Carrot and turnip make a potion base at the alchemy table (level 2). Brew from the base at the same table.
- Lesser vials are open to all. Stronger brews need Alchemy: medium flasks 10, grand flasks 20-25, oils and fortifications 30-35, elements 40, Flask of the Gods 50, philosopher's stones 60. Hellbroths need 10 to 40.
- No trader sells Alchemy brews. Grow them yourself.

THE HOF
- Gothi Eirik takes bones and trophies, not coin. Bone fragments buy the lesser wards and regeneration. Withered bone, charred bone and trophies buy the strong ones.
- One blessing from each group at a time: wards, might, vigour, wisdom, wayfaring. Blessings from different groups stack.

JEWELLERY
- Rings and torcs are forged from gems and metal. One ring and one torc at a time; the ring slot is shared with the mages' rings.
- Amber torc (Blacksmithing 15): +25 carry weight. Ember band (20): faster stamina. Warden's torc (30): faster health regen.
- Eitrweave band (30): faster eitr. Delver's band (40): half fall damage. Nightstep torc (50): harder to see and hear, Sneak +15.

BOSSES
- Every boss has a 1 in 8 unique drop, a teal-beamed legendary, rolled once per kill. Pets are 1 in 100 a kill: a hit drops one pet for every player online.
- The Seeress sells offerings for any boss you have summoned before, so coin buys another roll at the unique.

CAPES
- Reach 100 in a skill and Verdandi the Weaver will sell you its cape. All 23 at 100 unlocks the Allfather's cape.
- Seal a biome oath and Sigrun gives you its cape.

RULES
- Two players. Shared world. No item duping and no cheats in the real world. Have fun.
