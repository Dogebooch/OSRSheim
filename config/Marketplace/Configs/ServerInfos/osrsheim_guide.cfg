# OSRSheim in-game rulebook — an Info-type NPC (or DistancedUI) shows this page.
# Docs: https://kg-marketplace.pages.dev/configs/server-infos/
# NPC: Type = Info, Profile = gielheim_guide, Name Override = Gielheim Guide
[gielheim_guide]
WELCOME TO GIELHEIM — the tenth world, played as a long grind.

SKILLS
- Every skill grinds at half speed toward 100 and you never lose levels on death.
- Gear is gated: weapons need their weapon skill, armour and shields need Blocking to wear and Blacksmithing to craft, picks need Mining, hatchets need Lumberjacking, hellbroths need Alchemy.
- Bronze 15, iron 20, silver and wolf 30, black metal and padded 40, Mistlands 50, Ashlands 60, Deep North 70.

MONEY
- Coins drop from almost everything. Rare gem drops (amber, pearls, rubies, necklaces) land between 1 in 128 and 1 in 512 kills.
- Sell trophies and junk at the general store and gems to Gullveig. Bank at any banker.
- Spend it: the shopkeeper stocks arrows and mage brews you have already found, the hof sells stronger blessings for 1500-2000c, and dropping a hunt contract costs a third of its pay.
- No random magic gear drops. Haldor only sells treasure maps and bounties.

HUNTS AND TREASURE
- Huntmaster Hrafn hands out repeatable kill contracts that pay coin. Haldor sells treasure maps that pay coin when dug up.

BOSSES
- Every boss has a 1 in 34 unique drop and a 1 in 5000 pet. Both are shared one-per-player.
- The Seeress sells offerings for any boss you have summoned before, so coin buys another roll at the unique.

CAPES
- Reach 100 in a skill and Verdandi the Weaver will sell you its cape. All 23 at 100 unlocks the Allfather's cape.

RULES
- Two players. Shared world. No item duping and no cheats in the real world. Have fun.
