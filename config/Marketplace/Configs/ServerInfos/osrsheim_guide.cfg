[gielheim_guide]
WELCOME TO GIELHEIM, the tenth world, played as a long grind.

HOW IT WORKS
- Skills climb slowly toward 100 and you never lose them when you die.
- Weapons need their weapon skill before you can wield them. Armour and jewellery are free to wear but need Blacksmithing to forge.
- Every hour should move you toward something: a skill gate, a piece of gear, a rare drop or a page of the collection log.
- Rare drops do one thing nothing else does. They never replace your next tier of gear.

YOUR FIRST HOUR
1. Talk to Ulfar the Guide. His first quests walk you round Kaupang to meet everyone.
2. Take a hunt contract from Huntmaster Hrafn. It pays in gems.
3. Swear the Meadows oath with Sigrun the Oathkeeper. Four deeds, then a cape and the waystones.
4. Show every rare find to Halla the Skald before you sell or spend it.

WHERE TO LOOK
- Ask any townsperson "how does this work?" for the short version.
- The Gielheim Guide's book has the full pages: how each part of the game works, your journey so far, every creature's drops, what each skill opens and where every find comes from.

RULES
- Two players. Shared world. No item duping and no cheats in the real world. Have fun.
