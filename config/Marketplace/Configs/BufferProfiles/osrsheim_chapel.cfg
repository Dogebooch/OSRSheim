# Which prayers the chapel Buffer NPC offers. ONE line per profile (KG reads only the first).
# NPC: Type = Buffer, Profile = chapel, Dialogue = chapel.
[chapel]
ward_shieldmaiden, ward_grudge, ward_valkyrie, might_resolve, might_marrow, might_allfather, vigour_mercy, vigour_secondwind, vigour_ashen, wisdom_mimir, wisdom_seeker, wayfare_lox

# Biome-oath tier (Sigrun the Oathkeeper). The four entry prayers at -40% bone cost;
# the trophy-gated ones are deliberately absent.
[chapel_oath]
ward_shieldmaiden_oath, might_resolve_oath, vigour_mercy_oath, vigour_secondwind_oath
