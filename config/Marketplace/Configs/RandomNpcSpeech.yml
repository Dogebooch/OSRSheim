# OSRSheim idle NPC barks — KG Marketplace RandomNpcSpeech
# Docs: https://kg-marketplace.pages.dev/configs/random-npc-speech/
# Schema (verified against the docs 2026-09-19 after KG rejected the list form):
# RandomTexts is a MAPPING of named barks, not a list. Set key = the NPC's Profile
# (DLL 10.0.1 looks barks up by KGnpcProfile; there is no panel field). Interval in seconds, +/- InvervalRandomOffset.
bank:
  RandomTexts:
    bark1:
      Text: "Please do not stand on the counter."
    bark2:
      Text: "Your items are safe with us."
      OnlyIfLookingAtPlayer: true
    bark3:
      Text: "No we do not take a word as silver."
  Interval: 25
  InvervalRandomOffset: 8
lumbridge_guide:
  RandomTexts:
    bark1:
      Text: "Remember to check your skill levels before crafting."
    bark2:
      Text: "The forest is moving... probably."
      OnlyIfLookingAtPlayer: true
  Interval: 30
  InvervalRandomOffset: 10
vanity_tailor:
  RandomTexts:
    bark1:
      Text: "I have woven a thousand fates. Yours is still loose thread."
    bark2:
      Text: "Mastery takes more winters than most warriors see."
      OnlyIfLookingAtPlayer: true
  Interval: 35
  InvervalRandomOffset: 10
slayer_master:
  RandomTexts:
    bark1:
      Text: "Contract done? Back for another already?"
    bark2:
      Text: "Trolls. Always trolls."
      OnlyIfLookingAtPlayer: true
  Interval: 30
  InvervalRandomOffset: 10
dice_bag:
  RandomTexts:
    bark1:
      Text: "Doubling coins! Trust me."
    bark2:
      Text: "Fifty-fifty. Best odds in Gielheim."
      OnlyIfLookingAtPlayer: true
  Interval: 20
  InvervalRandomOffset: 6
