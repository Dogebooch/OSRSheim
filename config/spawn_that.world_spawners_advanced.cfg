# OSRSheim custom encounters; runtime verification pending.
# Superiors unlock with the key that opens their biome (the previous boss), so they roam the frontier;
# 0.03% per 900-second check.
# MaxSpawned 10: vanilla counts every loaded instance of the shared prefab, so 1 let any
# loaded common block the roll; vanilla also rolls min(MaxSpawned, elapsed/interval) times,
# so a stale zone gets 10 rolls (~0.3% a superior at 0.03%).
# No spawn within 150 m horizontally of any listed station.
# Base/outpost coverage requires a listed station (a forge is the earliest;
# 510 also counts piece_workbench, the only station a Meadows base has).
# SpawnDistance: 0 on 500-507 on purpose, they share the common prefab.
# This is spawn prevention, not protection from enemies lured back home.
# All loot bonuses use IDs 200+; vanilla/shared loot remains intact.

[WorldSpawner.500]
Name = Superior Greydwarf
PrefabName = Greydwarf
Biomes = BlackForest
Enabled = true
TemplateId = osrsheim_superior
HuntPlayer = false
SetRelentless = false
ConditionPositionMustNotBeNearPrefabs = forge, blackforge, piece_stonecutter, piece_artisanstation, WizardTable_TW, ArcaneAnvil_TW, WeavingLoom_TW, PotionCauldron_TW
ConditionPositionMustNotBeNearPrefabsDistance = 150
ConditionAltitudeMin = 0
MaxSpawned = 10
SpawnInterval = 900
SpawnChance = 0.03
LevelMin = 3
LevelMax = 3
GroupSizeMin = 1
GroupSizeMax = 1
SpawnDuringDay = true
SpawnDuringNight = true
RequiredGlobalKey = defeated_eikthyr
[WorldSpawner.500.CreatureLevelAndLootControl]
UseDefaultLevels = true
SetExtraEffect = Regenerating

