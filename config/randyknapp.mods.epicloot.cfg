## minimal: reduced enchantment power to be used with vanilla difficulty options.
## legendary: legacy balancing that can make players godlike. [Synced with Server]
# Setting type: String
# Default value: Default
# Acceptable values: balanced, legendary, minimal
Balance Template = balanced

## Sets how the drop system limits what item types can drop. Unlimited: no limits, exactly what's in the loot table will drop.
## BossKillUnlocksCurrentBiomeItems: items will drop for the current biome if the that biome's boss has been killed (Leather gear will drop once Eikthyr is killed).
## BossKillUnlocksNextBiomeItems: items will only drop for the current biome if the previous biome's boss is killed (Bronze gear will drop once Eikthyr is killed).
## PlayerMustKnowRecipe: (local world only) the item can drop if the player can craft it.
## PlayerMustHaveCraftedItem: (local world only) the item can drop if the player has already crafted it or otherwise picked it up. If an item type cannot drop, it will downgrade to an item of the same type and skill that the player has unlocked (i.e. swords will stay swords) according to iteminfo.json. [Synced with Server]
# Setting type: GatedItemTypeMode
# Default value: BossKillUnlocksCurrentBiomeItems
# Acceptable values: Unlimited, BossKillUnlocksCurrentBiomeItems, BossKillUnlocksNextBiomeItems, PlayerMustKnowRecipe, PlayerMustHaveCraftedItem
Item Drop Limits = BossKillUnlocksCurrentBiomeItems

