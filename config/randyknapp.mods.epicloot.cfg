# Default value: 1
# Acceptable value range: From 0 to 4
Global Drop Rate Modifier = 1

## Relative weight for a loot drop being a normal (possibly enchanted) item.
## Weighed against Shard Stone Drop Ratio, Items Unidentified Drop Ratio and Materials Drop Ratio; the four need not add up to 1, only their proportions matter.
