# Must equal [Merchants boat] Crafting Costs in marlthon.OdinShip.cfg (validator-enforced).
# build: Prefab:amount:amountPerLevel:recover
name: MercantShip
piecehammer: Hammer
build:
  - ClothShip:4:0:true
  - ResinWood:40:0:true
  - IronNails:100:0:true
  - ShipRope:2:0:true
  - OSRS_KeelElder:1:0:false
