# the OSRS_Keel* clones and silently drops the keel; this restates the full cost.
# Must equal [War Ship] Crafting Costs in marlthon.OdinShip.cfg (validator-enforced).
# build: Prefab:amount:amountPerLevel:recover
name: WarShip
piecehammer: Hammer
build:
  - ClothShip:4:0:true
  - CaulkedWood:50:0:true
  - IronNails:120:0:true
  - ShipRope:2:0:true
  - OSRS_KeelYagluth:1:0:false
  - OSRS_KeelQueen:1:0:false
