# Hull keel gate (RESEARCH.md §7). OdinShip resolves hull costs before wackydb adds
# the OSRS_Keel* clones and silently drops the keel; this restates the full cost.
# Must equal [Big Cargo Ship] Crafting Costs in marlthon.OdinShip.cfg (validator-enforced).
# build: Prefab:amount:amountPerLevel:recover
name: BigCargoShip
piecehammer: Hammer
build:
  - ClothShip:4:0:true
  - CaulkedWood:50:0:true
  - IronNails:150:0:true
  - ShipRope:4:0:true
  - OSRS_KeelModer:1:0:false
